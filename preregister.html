<body>
  <header class="page-header">

  <main class="preregister-main">
    <article class="preregister-wrap">
      <h1>事前登録</h1>

      <form class="preregister-form" data-preregister-form novalidate>
        <div class="preregister-field">
          <label for="preregister-email">メールアドレス</label>
          <input id="preregister-email" name="email" type="email" autocomplete="email" inputmode="email" required />
          <p class="preregister-field-note">使い捨てメールアドレス・適当な文字列での入力は禁止です。</p>
        </div>

        <label class="preregister-check">
          <input type="checkbox" name="privacy" data-privacy required />
          <span><a href="./privacy.html">プライバシーポリシー</a>に同意する</span>
        </label>

        <label class="preregister-check">
          <input type="checkbox" name="terms" data-terms required />
          <span><a href="./terms.html">利用規約</a>に同意する</span>
        </label>

        <button class="preregister-submit" type="submit" disabled>登録</button>
        <p class="preregister-status" role="status" aria-live="polite" data-preregister-status></p>
      </form>
    </article>
  </main>

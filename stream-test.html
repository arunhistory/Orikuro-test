<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#eef3fb"/>
  <title>配信テスト | Original Create Project</title>
  <link rel="stylesheet" href="./business.css?v=20260823-0958"/>
  <link rel="stylesheet" href="./navigation.css?v=20260822-2223"/>
  <link rel="stylesheet" href="./streaming-test.css?v=20260913-1"/>
  <link rel="stylesheet" href="./streaming-test-scope.css?v=20260914-test-scope1"/>
</head>
<body class="stream-page">
  <header class="page-header"><a class="page-brand" href="./index.html" aria-label="Original Create ホームページへ戻る"><img class="brand-symbol" src="./assets/oc-symbol-user.jpg" alt=""/><span>Original Create</span></a></header>
  <main class="stream-main">
    <section class="stream-gate">
      <p class="stream-gate-status" role="status" aria-live="polite" data-service-gate-status>利用準備を確認しています。</p>
      <article class="stream-app" data-service-content hidden>
        <section class="stream-unsupported" data-stream-unsupported hidden>
          <div class="stream-unsupported-mark" aria-hidden="true">!</div>
          <h1>この環境は対応していません。</h1>
          <p>対応ブラウザから配信テストを開いてください。</p>
          <a class="stream-home-link" href="./index.html">ホームへ戻る</a>
        </section>
        <section data-stream-supported hidden>
          <div class="stream-layout">
            <section class="stream-stage-card">
              <div class="stream-stage-head">
                <div class="stream-identity"><img class="stream-avatar" src="./assets/oc-symbol-user.jpg" alt=""/><div class="stream-title-wrap"><p class="stream-title">配信テスト</p><p class="stream-subtitle">配信者側のテスト体験 / staging</p></div></div>
                <div class="stream-live-row"><span class="stream-badge">TEST LIVE</span><span class="stream-clock" data-stream-clock>00:00</span></div>
              </div>
              <div class="stream-viewport" data-stream-preview>
                <div class="stream-status-pill"><span class="stream-status-dot"></span><span data-stream-status>準備中</span></div>
                <div class="stream-video-placeholder"><div><strong data-stream-preview-title>ラジオ配信</strong><span data-stream-preview-copy>音声を中心に配信するテストモードです。</span></div></div>
                <div class="stream-actions"><button class="stream-action" type="button" disabled>マイク</button><button class="stream-action" type="button" disabled>配信設定</button></div>
              </div>
            </section>
            <aside class="stream-side-card">
              <div class="stream-panel">
                <h2 class="stream-panel-title">配信方式</h2>
                <div class="stream-mode-grid" role="group" aria-label="配信方式">
                  <button class="stream-mode-option is-selected" type="button" data-stream-mode="radio" aria-pressed="true"><strong>ラジオ</strong><span>利用可能</span></button>
                  <button class="stream-mode-option" type="button" data-stream-mode="standing" aria-pressed="false"><strong>立ち絵</strong><span>利用可能</span></button>
                  <button class="stream-mode-option" type="button" disabled><strong>Live2D</strong><span>検討中</span></button>
                  <button class="stream-mode-option" type="button" disabled><strong>3D</strong><span>利用不可</span></button>
                  <button class="stream-mode-option" type="button" disabled><strong>キャプチャー</strong><span>利用不可</span></button>
                </div>
              </div>
              <div class="stream-panel stream-panel-separated">
                <h2 class="stream-panel-title">配信接続状態</h2>
                <div class="stream-checks">
                  <div class="stream-check"><span class="stream-check-label">WebTransport / QUIC</span><span class="stream-check-value" data-stream-state="transport">確認中</span></div>
                  <div class="stream-check"><span class="stream-check-label">配信セッション</span><span class="stream-check-value" data-stream-state="session">待機中</span></div>
                  <div class="stream-check"><span class="stream-check-label">二次合成</span><span class="stream-check-value" data-stream-state="composition">待機中</span></div>
                  <div class="stream-check"><span class="stream-check-label">音声</span><span class="stream-check-value" data-stream-state="audio">待機中</span></div>
                  <div class="stream-check"><span class="stream-check-label">最終送出</span><span class="stream-check-value" data-stream-state="output">待機中</span></div>
                </div>
                <div class="stream-control-grid"><button class="stream-control" type="button" disabled>配信設定</button><button class="stream-control" type="button" disabled>音声設定</button><button class="stream-control stream-control-primary" type="button" data-stream-start disabled>配信を開始</button></div>
              </div>
            </aside>
          </div>
        </section>
      </article>
    </section>
  </main>
  <script type="module" src="./assets/js/service-destination.js?v=20260912-flow-cache1"></script>
  <script type="module" src="./stream-test-ui.js?v=20260914-test-scope1"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#f4f7fb"/>
  <title>配信テスト | Original Create Project</title>
  <link rel="stylesheet" href="./business.css?v=20260823-0958"/>
  <link rel="stylesheet" href="./service-test.css?v=20260827-1"/>
  <link rel="stylesheet" href="./stream-test.css?v=20260918-1"/>
  <link rel="stylesheet" href="./navigation.css?v=20260822-2223"/>
</head>
<body>
  <header class="page-header">
    <a class="page-brand" href="./index.html" aria-label="Original Create ホームページへ戻る">
      <img class="brand-symbol" src="./assets/oc-symbol-user.jpg" alt=""/>
      <span>Original Create</span>
    </a>
  </header>
  <main class="service-test-main">
    <section class="service-test-wrap">
      <p class="service-gate-status" role="status" aria-live="polite" data-service-gate-status>利用準備を確認しています。</p>
      <article class="service-test-card stream-test-card" data-service-content hidden>
        <p class="service-test-kicker">STREAM TEST</p>
        <h1>配信テスト</h1>
        <p class="stream-test-lead">端末のカメラ映像を、実際の配信経路へ送るテストです。</p>
        <div class="stream-preview-wrap">
          <video class="stream-preview" data-stream-preview autoplay muted playsinline></video>
          <span class="stream-live-badge">PUBLISHER TEST</span>
        </div>
        <p class="stream-status" role="status" aria-live="polite" data-stream-status>準備中です。</p>
        <div class="stream-controls">
          <button class="stream-control" type="button" data-stream-start disabled>配信開始</button>
          <button class="stream-control secondary" type="button" data-stream-stop disabled>停止</button>
        </div>
        <div class="stream-metrics" aria-label="配信テスト状態">
          <div class="stream-metric"><span>Stream ID</span><strong data-stream-id>-</strong></div>
          <div class="stream-metric"><span>送信パケット</span><strong data-stream-sent>0</strong></div>
          <div class="stream-metric"><span>ACK</span><strong data-stream-ack>0</strong></div>
        </div>
        <p class="stream-detail" data-stream-detail>配信経路を確認しています。</p>
        <a class="service-test-home" href="./index.html">ホームへ戻る</a>
      </article>
    </section>
  </main>
  <script type="module" src="./stream-test.js?v=20260918-1"></script>
</body>
</html>

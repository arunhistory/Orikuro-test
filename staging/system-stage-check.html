<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>0%ステージ接続確認 | Original Create</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#10141f;color:#f5f6fa}
main{max-width:620px;margin:auto;min-height:100svh;padding:40px 20px 52px;display:flex;flex-direction:column;justify-content:center}
section{border:1px solid #3c4a65;border-radius:18px;padding:24px;background:#1b2233}
h1{font-size:1.5rem;margin:4px 0 14px}p{margin:12px 0}small{color:#a9bad1}
#status{font-weight:700;overflow-wrap:anywhere}#status[data-state="ready"]{color:#81e4a7}#status[data-state="error"]{color:#ffafae}
dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:18px 0}dt{color:#a9bad1}dd{margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
a,button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700}
a{background:#68b8ff;color:#10141f;text-decoration:none}button{background:#3f4c65;color:white;cursor:pointer}
[hidden]{display:none!important}.note{font-size:.9rem;color:#c5d0e1}
</style>
</head>
<body>
<main><section>
<small>ORIGINAL CREATE / STAGING ONLY</small>
<h1>Cloudflare 0%ステージ確認</h1>
<p id="status" data-state="waiting" role="status" aria-live="polite">アクセス権限と新Go WASM版を確認しています…</p>
<dl id="report" hidden>
<dt>検査</dt><dd>Go WASM・合成Tracking入力</dd>
<dt>対象</dt><dd>Cloudflare 0%版（通常配信は100%版）</dd>
<dt>バージョン</dt><dd id="version">未確認</dd>
<dt>実カメラ E2E</dt><dd>未検証</dd>
</dl>
<p class="note">この画面は配信を開始せず、認証付きの読み取り・合成入力テストのみを実行します。立ち絵・実カメラの確認は次の配信画面で行います。現在、その配信WebSocketは現行100%版へ接続されます。</p>
<div class="actions">
<a id="continue" hidden href="#">認証付き配信テストへ進む</a>
<button id="retry" type="button" hidden>再確認</button>
</div>
</section></main>
<script>
(()=>{
  const status=document.getElementById("status");
  const report=document.getElementById("report");
  const version=document.getElementById("version");
  const next=document.getElementById("continue");
  const retry=document.getElementById("retry");
  const params=new URLSearchParams(location.hash.startsWith("#")?location.hash.slice(1):"");
  const accessKey=params.get("op")||"";
  history.replaceState(null,"",location.pathname+location.search);
  if(!/^[a-f0-9]{64}$/.test(accessKey)){
    status.dataset.state="error";
    status.textContent="有効な64文字のアクセスキーが付いたURLから開いてください。";
    return;
  }
  let running=false;
  async function check(){
    if(running)return;
    running=true;next.hidden=true;retry.hidden=true;report.hidden=true;
    status.dataset.state="waiting";
    status.textContent="0%ステージの認証付きGo WASM合成入力テストを実行中…";
    try{
      const response=await fetch("https://mpuhgfbdkxmhynytwhzu.supabase.co/functions/v1/external-services-system/system-stream-stage-check",{
        method:"POST",
        headers:{"content-type":"application/json"},
        body:JSON.stringify({accessKey}),
        credentials:"omit",
        cache:"no-store",
        referrerPolicy:"no-referrer"
      });
      const data=await response.json();
      if(!response.ok||data?.ok!==true||data?.result?.verified!==true||
         data?.result?.targetTrafficPercent!==0||data?.result?.liveCameraVerified!==false)
        throw new Error(typeof data?.code==="string"?data.code:"STAGE_CHECK_FAILED");
      status.textContent="0%ステージ版のGo WASM合成入力テストに成功しました。";
      status.dataset.state="ready";
      const id=String(data.result.stageVersionId||"");
      version.textContent=/^[a-f0-9-]{36}$/i.test(id)?id.slice(0,8)+"…":"検査済み";
      report.hidden=false;
      next.href="./system-stream-test.html#op="+accessKey;
      next.hidden=false;
    }catch(e){
      const code=e instanceof Error&&/^[A-Z_]+$/.test(e.message)?e.message:"STAGE_REQUEST_FAILED";
      status.textContent="確認できませんでした（"+code+"）。通常配信側で成功したとは判定しません。";
      status.dataset.state="error";
      retry.hidden=false;
    }finally{running=false;}
  }
  retry.addEventListener("click",check);
  void check();
})();
</script>
</body>
</html>

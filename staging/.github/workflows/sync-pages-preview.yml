name: Sync Pages Preview

on:
  push:
    branches:
      - main
      - staging
  workflow_run:
    workflows:
      - Build client submission pipeline
    types:
      - completed

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-preview-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'staging')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch publishing branches
        run: |
          set -euo pipefail
          git fetch origin main staging pages-preview

      - name: Compose production and staging tree
        run: |
          set -euo pipefail
          rm -rf /tmp/oc-pages-publish /tmp/oc-pages-preview
          mkdir -p /tmp/oc-pages-publish/staging
          git archive origin/main | tar -x -C /tmp/oc-pages-publish
          git archive origin/staging | tar -x -C /tmp/oc-pages-publish/staging
          git worktree add /tmp/oc-pages-preview origin/pages-preview
          find /tmp/oc-pages-preview -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/oc-pages-publish/. /tmp/oc-pages-preview/

      - name: Publish composed tree to pages-preview
        id: publish
        run: |
          set -euo pipefail
          cd /tmp/oc-pages-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync main and staging preview"
          git push origin HEAD:pages-preview
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild Pages only when pages-preview is active
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site_json="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          source_branch="$(printf '%s' "$site_json" | jq -r '.source.branch // ""')"
          if [ "$source_branch" != "pages-preview" ]; then
            echo "Pages source is not pages-preview yet; rebuild skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            >/dev/null

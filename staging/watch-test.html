<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#eef3fb"/>
  <title>視聴テスト | Original Create Project</title>
  <link rel="stylesheet" href="./business.css?v=20260823-0958"/>
  <link rel="stylesheet" href="./navigation.css?v=20260822-2223"/>
  <link rel="stylesheet" href="./streaming-test.css?v=20260914-test-scope1"/>
</head>
<body class="stream-page">
  <header class="page-header"><a class="page-brand" href="./index.html" aria-label="Original Create ホームページへ戻る"><img class="brand-symbol" src="./assets/oc-symbol-user.jpg" alt=""/><span>Original Create</span></a></header>
  <main class="stream-main">
    <section class="stream-gate">
      <p class="stream-gate-status" role="status" aria-live="polite" data-service-gate-status>利用準備を確認しています。</p>
      <article class="stream-app" data-service-content hidden>
        <section class="stream-unsupported" data-stream-unsupported hidden>
          <div class="stream-unsupported-mark" aria-hidden="true">!</div>
          <h1>この環境は対応していません。</h1>
          <p>対応ブラウザから視聴テストを開いてください。</p>
          <a class="stream-home-link" href="./index.html">ホームへ戻る</a>
        </section>
        <section data-stream-supported hidden>
          <div class="stream-layout">
            <section class="stream-stage-card">
              <div class="stream-stage-head">
                <div class="stream-identity"><img class="stream-avatar" src="./assets/oc-symbol-user.jpg" alt=""/><div class="stream-title-wrap"><p class="stream-title">モデル配信</p><p class="stream-subtitle">視聴テスト専用 / 配信テストとは独立</p></div></div>
                <div class="stream-live-row"><span class="stream-badge">MODEL LIVE</span><span class="stream-clock" data-viewer-status>準備中</span></div>
              </div>
              <div class="stream-viewport" data-model-stream-surface>
                <div class="stream-status-pill"><span class="stream-status-dot"></span><span>視聴テスト</span></div>
                <canvas class="stream-media-canvas" data-watch-media-canvas width="640" height="360" hidden></canvas><div class="stream-video-placeholder" data-watch-placeholder><div><strong>モデル配信</strong><span>視聴テスト用の配信へ接続します。</span></div></div>
                <div class="stream-actions"><button class="stream-action" type="button" disabled>画質</button><button class="stream-action" type="button" data-watch-audio disabled>音量</button><button class="stream-action stream-action-like" type="button" disabled><span class="stream-heart">♥</span> いいね</button></div>
              </div>
            </section>
            <aside class="stream-side-card stream-chat">
              <div class="stream-chat-head">コメント</div>
              <div class="stream-chat-list" aria-live="polite"><p class="stream-chat-empty">モデル配信を視聴しながら、コメント・ギフト・スパチャなどの視聴者機能を体験します。</p></div>
              <div class="stream-chat-compose">
                <form class="stream-comment-box" data-comment-form><input class="stream-comment-input" data-comment-input type="text" maxlength="200" autocomplete="off" placeholder="コメントを入力" disabled/><button class="stream-send" data-comment-send type="submit" disabled aria-label="コメントを送信">送</button></form>
                <div class="stream-support-row"><button class="stream-support-btn" data-gift-button type="button" disabled>ギフト</button><button class="stream-support-btn" data-superchat-button type="button" disabled>スパチャ</button><button class="stream-like-btn" data-like-button type="button" disabled aria-label="いいね">♥</button></div>
              </div>
            </aside>
          </div>
        </section>
      </article>
    </section>
  </main>
  <script type="module" src="./assets/js/service-destination.js?v=20260919-flow4"></script>
  <script type="module" src="./watch-test-ui.js?v=20260920-compat3"></script>
</body>
</html>

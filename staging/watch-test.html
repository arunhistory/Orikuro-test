<!doctype html>
<html lang="ja" data-broadcast-phase="live">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#11131d"/>
  <title>視聴テスト | Original Create Project</title>
  <link rel="stylesheet" href="./broadcast-app.css?v=20260920-standing1"/>
  <link rel="stylesheet" href="./watch-app.css?v=20261004-view1"/>
</head>
<body class="broadcast-app-page watch-app-page">
  <main class="stream-main">
    <section class="stream-gate">
      <p class="stream-gate-status" role="status" aria-live="polite" data-service-gate-status>利用準備を確認しています。</p>

      <article class="stream-app" data-service-content hidden>
        <section class="stream-unsupported" data-stream-unsupported hidden>
          <div class="stream-unsupported-mark" aria-hidden="true">!</div>
          <h1>視聴を開始できません</h1>
          <p data-stream-unsupported-reason>この環境では視聴を開始できません。</p>
          <a class="stream-home-link" href="./index.html">ホームへ戻る</a>
        </section>

        <section data-stream-supported hidden>
          <div class="broadcast-shell">
            <header class="broadcast-header">
              <a class="broadcast-close" href="./index.html" aria-label="閉じる">×</a>
              <strong class="broadcast-header-title">視聴テスト</strong>
              <span class="broadcast-header-spacer" aria-hidden="true"></span>
            </header>

            <section class="watch-live-screen">
              <div class="broadcast-live-preview watch-live-preview">
                <canvas class="watch-media-canvas" data-watch-media-canvas width="640" height="360" hidden></canvas>

                <div class="watch-material-stage" data-watch-material-stage aria-label="自動素材配信"></div>
                <div class="watch-material-progress" data-watch-material-progress aria-hidden="true"><span></span></div>
                <div class="watch-program-badge" data-watch-program-status>自動素材配信</div>

                <div class="broadcast-live-hud">
                  <div class="broadcast-live-owner-row">
                    <img class="broadcast-live-owner-icon" src="./assets/oc-symbol-user.jpg" alt="配信者アイコン"/>
                    <div class="broadcast-live-owner-copy">
                      <strong>Original Create</strong>
                      <div class="broadcast-live-subtitle-row">
                        <span>視聴テスト / 自動素材配信</span>
                      </div>
                    </div>
                    <span class="broadcast-live-status">
                      <i></i>
                      <b>LIVE</b>
                    </span>
                  </div>

                  <div class="broadcast-live-quickbar">
                    <button type="button" disabled><small>応援</small><strong>0</strong></button>
                    <button type="button" disabled><small>リスナー</small><strong>--</strong></button>
                    <button type="button" disabled><small>いいね</small><strong>0</strong></button>
                  </div>
                </div>
              </div>

              <div class="broadcast-live-controls watch-live-controls">
                <div class="watch-status-row">
                  <span class="watch-status" data-viewer-status role="status" aria-live="polite">準備中</span>
                  <button class="watch-audio-button" type="button" data-watch-audio disabled>音声ON</button>
                </div>

                <section class="watch-chat" aria-label="コメント">
                  <div class="watch-chat-head">
                    <strong>コメント</strong>
                    <span>視聴者機能</span>
                  </div>
                  <div class="watch-chat-list" aria-live="polite">
                    <p class="watch-chat-empty">コメント・ギフト・スパチャ・いいねは、接続状態に応じて利用できます。</p>
                  </div>
                  <form class="watch-comment-box" data-comment-form>
                    <input class="watch-comment-input" data-comment-input type="text" maxlength="200" autocomplete="off" placeholder="コメントを入力" disabled/>
                    <button class="watch-send" data-comment-send type="submit" disabled aria-label="コメントを送信">送</button>
                  </form>
                  <div class="watch-support-row">
                    <button class="watch-support-btn" data-gift-button type="button" disabled>ギフト</button>
                    <button class="watch-support-btn" data-superchat-button type="button" disabled>スパチャ</button>
                    <button class="watch-like-btn" data-like-button type="button" disabled aria-label="いいね">♥</button>
                  </div>
                </section>
              </div>
            </section>
          </div>
        </section>
      </article>
    </section>
  </main>

  <script type="module" src="./assets/js/service-destination.js?v=20260919-flow4"></script>
  <script type="module" src="./watch-test-ui.js?v=20261004-view1"></script>
</body>
</html>

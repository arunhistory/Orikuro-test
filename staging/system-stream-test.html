<!doctype html>
<html lang="ja" data-broadcast-phase="prep" data-system-test="true">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#11131d"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>配信準備 | Original Create Project</title>
  <link rel="stylesheet" href="./broadcast-app.css?v=20260920-mic1"/>
</head>
<body class="broadcast-app-page">
  <main class="stream-main">
    <section class="stream-gate">
      <p class="stream-gate-status" role="status" aria-live="polite" data-service-gate-status>システム配信テストを準備しています。</p>

      <article class="stream-app" data-service-content hidden>
        <section class="stream-unsupported" data-stream-unsupported hidden>
          <div class="stream-unsupported-mark" aria-hidden="true">!</div>
          <h1>配信を開始できません</h1>
          <p data-stream-unsupported-reason>この環境では配信を開始できません。</p>
          <a class="stream-home-link" href="./index.html">ホームへ戻る</a>
        </section>

        <section data-stream-supported hidden>
          <div class="broadcast-shell">
            <header class="broadcast-header">
              <a class="broadcast-close" href="./index.html" aria-label="閉じる">×</a>
              <strong class="broadcast-header-title">配信準備</strong>
              <span class="broadcast-header-spacer" aria-hidden="true"></span>
            </header>

            <section class="broadcast-preview" data-stream-preview>
              <div class="broadcast-preview-glow" aria-hidden="true"></div>
              <div class="broadcast-character">
                <div class="broadcast-avatar-frame">
                  <img src="./assets/oc-symbol-user.jpg" alt="Original Create"/>
                </div>
                <h1 class="broadcast-preview-title" data-stream-preview-title>ラジオ</h1>
                <p class="broadcast-preview-copy" data-stream-preview-copy>音声だけで配信します。</p>
              </div>

              <div class="broadcast-status-pill">
                <span class="broadcast-live-dot" aria-hidden="true"></span>
                <span data-stream-status data-realtime-status>準備中</span>
                <span class="broadcast-timer" data-stream-clock>00:00</span>
              </div>
            </section>

            <section class="broadcast-controls">
              <div class="broadcast-mode-tabs" role="group" aria-label="配信方式">
                <button class="stream-mode-option is-selected" type="button" data-stream-mode="radio" aria-pressed="true">
                  <strong>ラジオ</strong><span>音声のみ</span>
                </button>
                <button class="stream-mode-option" type="button" data-stream-mode="standing" aria-pressed="false" disabled>
                  <strong>立ち絵</strong><span>準備中</span>
                </button>
              </div>

              <div class="broadcast-mic-test" data-mic-test data-state="waiting">
                <div class="broadcast-mic-head">
                  <strong>マイクテスト</strong>
                  <span data-mic-path-status>配信開始後に確認</span>
                </div>
                <div class="broadcast-mic-meter" data-mic-meter role="meter" aria-label="リスナー送出音声レベル" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <span data-mic-meter-fill></span>
                </div>
                <small>リスナーへ送る実際の音声データを監視</small>
              </div>

              <p class="stream-start-feedback" data-stream-feedback role="status" aria-live="polite">マイクを使って音声だけで配信します。</p>

              <div class="broadcast-primary-actions">
                <button class="stream-control stream-control-primary" type="button" data-stream-start data-audio-start disabled>ラジオ配信スタート</button>
                <button class="stream-control stream-control-stop" type="button" data-audio-stop disabled>配信を終了</button>
              </div>

              <div class="broadcast-debug-state" aria-hidden="true">
                <span data-stream-state="transport">確認中</span>
                <span data-stream-state="session">待機中</span>
                <span data-stream-state="composition">対象外</span>
                <span data-stream-state="audio" data-audio-status>待機中</span>
                <span data-stream-state="output">待機中</span>
              </div>
            </section>
          </div>
        </section>
      </article>
    </section>
  </main>

  <script type="module" src="./assets/js/system-stream-bootstrap.js?v=20260920-stop1"></script>
  <script type="module" src="./assets/js/stream-realtime.js?v=20260920-mic1"></script>
  <script type="module" src="./assets/js/stream-lifecycle.js?v=20260920-stop1"></script>
  <script type="module" src="./stream-test-ui.js?v=20260920-mic1"></script>
</body>
</html>

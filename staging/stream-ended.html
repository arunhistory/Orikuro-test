<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#eef3fb"/>
  <title>配信結果 | Original Create Project</title>
  <link rel="stylesheet" href="./business.css?v=20260823-0958"/>
  <link rel="stylesheet" href="./navigation.css?v=20260822-2223"/>
  <link rel="stylesheet" href="./streaming-test.css?v=20261005-result2"/>
</head>
<body class="stream-page">
  <header class="page-header">
    <a class="page-brand" href="./index.html" aria-label="Original Create ホームページへ戻る">
      <img class="brand-symbol" src="./assets/oc-symbol-user.jpg" alt=""/>
      <span>Original Create</span>
    </a>
  </header>
  <main class="stream-main">
    <section class="stream-end-screen">
      <small class="stream-end-kicker" data-end-kicker>配信終了</small>
      <div class="stream-end-icon" data-end-icon aria-hidden="true">✓</div>
      <div class="stream-end-status" data-end-status data-state="success">終了済み</div>
      <h1 data-end-title>配信は終了しました</h1>
      <p data-end-detail>配信は終了しました。</p>

      <section class="stream-test-result" data-test-result hidden aria-label="配信テスト結果">
        <div class="stream-test-result-row">
          <span>終了処理</span>
          <strong data-result-stop>確認済み</strong>
        </div>
        <div class="stream-test-result-row">
          <span>配信形式</span>
          <strong data-result-mode>--</strong>
        </div>
        <div class="stream-test-result-row">
          <span>配信時間</span>
          <strong data-result-duration>--</strong>
        </div>
        <div class="stream-test-result-row">
          <span>終了理由</span>
          <strong data-result-reason>--</strong>
        </div>
        <div class="stream-test-result-row stream-test-result-id">
          <span>Stream ID</span>
          <code data-result-stream-id>--</code>
        </div>
      </section>

      <div class="stream-end-actions">
        <a class="stream-end-home" href="./index.html">ホームへ戻る</a>
        <a class="stream-end-secondary" href="./watch-test.html">視聴テストへ戻る</a>
      </div>
    </section>
  </main>
  <script type="module" src="./stream-ended.js?v=20261005-result2"></script>
</body>
</html>

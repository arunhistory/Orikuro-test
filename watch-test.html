<!doctype html>
<html lang="ja" data-broadcast-phase="live">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#05060a"/>
  <title>視聴テスト | Original Create Project</title>
  <link rel="stylesheet" href="./broadcast-app.css?v=20260920-standing1"/>
  <link rel="stylesheet" href="./watch-app.css?v=20261005-vertical3"/>
</head>
<body class="broadcast-app-page watch-app-page">
  <main class="stream-main">
    <section class="stream-gate">
      <p class="stream-gate-status" role="status" aria-live="polite" data-service-gate-status>利用準備を確認しています。</p>

      <article class="stream-app" data-service-content hidden>
        <section class="stream-unsupported" data-stream-unsupported hidden>
          <div class="stream-unsupported-mark" aria-hidden="true">!</div>
          <h1>視聴を開始できません</h1>
          <p data-stream-unsupported-reason>この環境では視聴を開始できません。</p>
          <a class="stream-home-link" href="./index.html">ホームへ戻る</a>
        </section>

        <section data-stream-supported hidden>
          <div class="broadcast-shell">
            <section class="watch-live-screen" aria-label="縦型ライブ配信">
              <div class="watch-video-stage" aria-hidden="true">
                <canvas class="watch-scene-canvas watch-demo-canvas" data-watch-demo-canvas width="360" height="640"></canvas>
                <canvas class="watch-scene-canvas watch-media-canvas" data-watch-media-canvas width="360" height="640" hidden></canvas>
                <div class="watch-waiting" data-watch-waiting>
                  <span>背景と立ち絵を準備しています…</span>
                </div>
              </div>

              <div class="watch-ui-frame">
                <header class="watch-topbar">
                  <a class="watch-close" href="./index.html" aria-label="閉じる">×</a>
                  <div class="watch-top-status">
                    <strong data-watch-program-status>接続中</strong>
                    <span data-viewer-status role="status" aria-live="polite">準備中</span>
                  </div>
                  <button class="watch-audio-button" type="button" data-watch-audio>音声</button>
                </header>

                <div class="broadcast-live-hud watch-live-hud">
                  <div class="broadcast-live-owner-row">
                    <img class="broadcast-live-owner-icon" src="./assets/oc-symbol-user.jpg" alt="配信者アイコン"/>
                    <div class="broadcast-live-owner-copy">
                      <strong>Original Create</strong>
                      <div class="broadcast-live-subtitle-row"><span>立ち絵配信テスト</span></div>
                    </div>
                    <span class="broadcast-live-status"><i></i><b>LIVE</b></span>
                  </div>

                  <div class="broadcast-live-quickbar watch-quickbar">
                    <button type="button" data-support-score-button>
                      <small>応援</small><strong data-support-score>0</strong>
                    </button>
                    <button type="button" data-ranking-button>
                      <small>ランキング</small><strong data-ranking-position>--</strong>
                    </button>
                    <button type="button" data-listener-button>
                      <small>リスナー</small><strong data-listener-count>1</strong>
                    </button>
                    <button type="button" data-like-button-top>
                      <small>いいね</small><strong data-like-count>0</strong>
                    </button>
                  </div>
                </div>

                <div class="watch-side-actions" aria-label="視聴操作">
                  <button type="button" data-ranking-button-side><b>🏆</b><span>順位</span></button>
                  <button type="button" data-gift-button><b>🎁</b><span>ギフト</span></button>
                  <button type="button" data-superchat-button><b>💬</b><span>スパチャ</span></button>
                  <button type="button" data-like-button><b>♥</b><span>いいね</span></button>
                </div>

                <section class="watch-chat-overlay" aria-label="コメント">
                  <div class="watch-chat-list" data-comment-list aria-live="polite">
                    <p class="watch-chat-empty" data-comment-empty>コメントしてみよう</p>
                  </div>
                  <form class="watch-comment-box" data-comment-form>
                    <input class="watch-comment-input" data-comment-input type="text" maxlength="200" autocomplete="off" placeholder="コメントを入力"/>
                    <button class="watch-send" data-comment-send type="submit" aria-label="コメントを送信">送</button>
                  </form>
                </section>

                <section class="watch-ranking-panel" data-ranking-panel hidden aria-label="応援ランキング">
                  <header>
                    <div><small>このテスト枠</small><strong>応援ランキング</strong></div>
                    <button type="button" data-ranking-close aria-label="閉じる">×</button>
                  </header>
                  <p class="watch-ranking-note">テスト操作のみ。ポイント決済・残高変更は行いません。</p>
                  <ol class="watch-ranking-list" data-ranking-list>
                    <li data-ranking-empty>まだ応援はありません。</li>
                  </ol>
                </section>

                <div class="watch-toast" data-watch-toast hidden role="status" aria-live="polite"></div>
              </div>
            </section>
          </div>
        </section>
      </article>
    </section>
  </main>

  <script type="module" src="./watch-test-ui.js?v=20261005-vertical3"></script>
  <script type="module" src="./watch-entry.js?v=20261005-vertical3"></script>
</body>
</html>

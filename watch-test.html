<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#f4f7fb"/>
  <title>視聴テスト | Original Create Project</title>
  <link rel="stylesheet" href="./business.css?v=20260823-0958"/>
  <link rel="stylesheet" href="./service-test.css?v=20260827-1"/>
  <link rel="stylesheet" href="./watch-test.css?v=20260918-1"/>
  <link rel="stylesheet" href="./navigation.css?v=20260822-2223"/>
</head>
<body>
  <header class="page-header">
    <a class="page-brand" href="./index.html" aria-label="Original Create ホームページへ戻る">
      <img class="brand-symbol" src="./assets/oc-symbol-user.jpg" alt=""/>
      <span>Original Create</span>
    </a>
  </header>
  <main class="service-test-main">
    <section class="service-test-wrap">
      <p class="service-gate-status" role="status" aria-live="polite" data-service-gate-status>利用準備を確認しています。</p>
      <article class="service-test-card watch-test-card" data-service-content hidden>
        <p class="service-test-kicker">WATCH TEST</p>
        <h1>視聴テスト</h1>
        <p class="watch-test-lead">Northflank から実際の配信映像・音声を受信します。</p>
        <div class="watch-canvas-wrap">
          <canvas class="watch-canvas" data-watch-canvas width="640" height="360"></canvas>
          <span class="watch-live-badge">VIEWER TEST</span>
        </div>
        <p class="watch-status" role="status" aria-live="polite" data-watch-status>準備中です。</p>
        <div class="watch-controls">
          <button class="watch-control" type="button" data-watch-start disabled>視聴開始</button>
          <button class="watch-control secondary" type="button" data-watch-stop disabled>視聴終了</button>
        </div>
        <div class="watch-metrics">
          <div class="watch-metric"><span>Stream ID</span><strong data-watch-stream-id>開始時に取得</strong></div>
          <div class="watch-metric"><span>映像</span><strong>H.264 Annex-B</strong></div>
          <div class="watch-metric"><span>音声</span><strong>OAP1 PCM</strong></div>
        </div>
        <p class="watch-detail" data-watch-detail>視聴経路を確認しています。</p>
        <a class="service-test-home" href="./index.html">ホームへ戻る</a>
      </article>
    </section>
  </main>
  <script type="module" src="./watch-test.js?v=20260918-1"></script>
</body>
</html>

name: Build page signature WASM

on:
  push:
    branches: [main]
    paths:
      - 'wasm-signature/**'
      - '.github/workflows/build-page-signature-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Rust stable WASM target
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Build release WASM
        env:
          RUSTFLAGS: '-C target-feature=-reference-types,-multivalue'
        run: |
          cargo build \
            --manifest-path wasm-signature/Cargo.toml \
            --target wasm32-unknown-unknown \
            --release

      - name: Install generated module
        run: |
          mkdir -p assets/wasm
          cp wasm-signature/target/wasm32-unknown-unknown/release/oc_page_signature.wasm assets/wasm/page_signature.wasm
          sha256sum assets/wasm/page_signature.wasm | awk '{print $1}' > assets/wasm/page_signature.wasm.sha256

      - name: Commit generated WASM
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wasm/page_signature.wasm assets/wasm/page_signature.wasm.sha256 wasm-signature/Cargo.lock
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Build page signature WASM'
          git push
